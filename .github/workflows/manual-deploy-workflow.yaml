name: Manual launch deploy on server
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible : dev | qualif | recette"
        required: true
        type: choice
        options:
          - recette
          - qualif
          - dev
        default: recette
      sprint:
        description: "Sprint à déployer (ex. Sprint 16) - ignoré si un tag est saisi"
        required: false
        type: string
      tag:
        description: "Tag explicite à déployer sur tous les repositories (ex. 0.14.0-rc) - prioritaire sur le sprint"
        required: false
        type: string

jobs:
  call-manual-deploy-workflow:
    uses: avenirs-esr/avenirs-workflows/.github/workflows/manual-deploy-workflow.yaml@main
    with:
      environment: ${{ inputs.environment }}
      sprint: ${{ inputs.sprint }}
      tag: ${{ inputs.tag }}
    secrets: inherit
