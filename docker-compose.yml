  - path: ./services/avenirs-portfolio/docker-compose.yml
    env_file:
      - .env
      - ./services/avenirs-portfolio/.env

  - path: ./services/opensearch/docker-compose.yml
    env_file:
      - .env
      - ./services/opensearch/.env

  - path: ./services/valkey/docker-compose.yml
    env_file:
      - .env
