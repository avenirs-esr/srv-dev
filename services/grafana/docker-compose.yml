services:

  avenirs-grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: ${AVENIRS_GRAFANA_CONTAINER_NAME}
    restart: always
    ports:
      - "${AVENIRS_GRAFANA_CONTAINER_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./avenirs-grafana-conf/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./avenirs-grafana-conf/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./avenirs-grafana-conf/dashboards:/etc/grafana/dashboards
    networks:
      - avenirs-api-network

networks: 
  avenirs-api-network:
    external: true
    name: ${AVENIRS_NETWORK}
  