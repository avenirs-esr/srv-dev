services:
  openldap-init-custom-ldif:
    image: alpine:latest
    container_name: ${AVENIRS_OPENLDAP_CONTAINER_NAME}-init-custom-ldif
    restart: "no"
    volumes:
      - ${LDIF_CUSTOM_DIR}:/mnt/custom-ro:ro
      - openldap_custom_ldif_dir:/container/service/slapd/assets/config/bootstrap/ldif/custom
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "set -e; SRC=/mnt/custom-ro; DEST=/container/service/slapd/assets/config/bootstrap/ldif/custom; echo '[init] source:'; ls -la \"$$SRC\"; mkdir -p \"$$DEST\"; echo '[init] dest before:'; ls -la \"$$DEST\"; find \"$$DEST\" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; cp -a \"$$SRC\"/. \"$$DEST\"/; echo '[init] dest after:'; ls -la \"$$DEST\"; test -f \"$$DEST/100-openldap-fixtures.ldif\""
  openldap:
    container_name: ${AVENIRS_OPENLDAP_CONTAINER_NAME}
    image: osixia/openldap:1.5.0
    restart: always
    depends_on:
      openldap-init-custom-ldif:
        condition: service_completed_successfully
    environment:
      LDAP_LOG_LEVEL: "0"
      LDAP_ORGANISATION: ${LDAP_ORGANISATION}
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_ADMIN_PASSWORD: ${SEC_LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${SEC_LDAP_CONFIG_PASSWORD}
      LDAP_READONLY_USER: ${LDAP_READONLY_USER}
      LDAP_READONLY_USER_USERNAME: ${LDAP_READONLY_USER_USERNAME}
      LDAP_READONLY_USER_PASSWORD: ${SEC_LDAP_READONLY_USER_PASSWORD}
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_BACKEND: "mdb"
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_DH_PARAM_FILENAME: "dhparam.pem"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_ENFORCE: "false"
      LDAP_TLS_CIPHER_SUITE: "SECURE256:-VERS-SSL3.0"
      LDAP_TLS_VERIFY_CLIENT: "demand"
      LDAP_REPLICATION: "false"
      KEEP_EXISTING_CONFIG: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_SSL_HELPER_PREFIX: "ldap"
    tty: true
    stdin_open: true
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - openldap_custom_ldif_dir:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"
      - "636:636"
    # For replication to work correctly, domainname and hostname must be
    # set correctly so that "hostname"."domainname" equates to the
    # fully-qualified domain name for the host.
    domainname: "example.org"
    hostname: "ldap-server"
    networks:
      openldap-network:
 
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: ${AVENIRS_LDAP_ADMIN_CONTAINER_NAME}
    restart: always
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on:
      - openldap
    networks:
      openldap-network:
networks: 
  openldap-network:
    external: true
    name: $AVENIRS_NETWORK

volumes:
  openldap_data:
  openldap_config:
  openldap_custom_ldif_dir:
