services:
  le-apache:
    container_name: ${AVENIRS_APACHE_CONTAINER_NAME}
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        OVERLAY_DIR: ${APACHE_OVERLAY_BASENAME}
        HTTPD_VERSION: ${HTTPD_VERSION}
    restart: always
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - api-specs:/usr/local/apache2/htdocs/api-specs:ro
    networks:
      - apache-network
networks: 
  apache-network:
    external: true
    name: ${AVENIRS_NETWORK}
volumes:
  api-specs: {}