services:

  avenirs-portfolio-api:
    container_name: ${AVENIRS_PORTFOLIO_API_CONTAINER_NAME}

    build:
      context: .
      dockerfile: ./Dockerfile-avenirs-portfolio-api
      args:
        AVENIRS_PORTFOLIO_API_VERSION: ${AVENIRS_PORTFOLIO_API_VERSION}
        OVERLAY_DIR: ${AVENIRS_PORTFOLIO_API_OVERLAY_BASENAME}
        JAVA_ALPINE_VERSION: ${JAVA_ALPINE_VERSION}
    restart: always
    ports:
      - "${AVENIRS_PORTFOLIO_API_CONTAINER_PORT}:10000"
    environment:
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
    depends_on:
      - postgresql-primary
    networks:
      - avenirs-api-network
    volumes:
      - srv-dev_file-storage:/workspace/app/target/storage

  avenirs-portfolio-back-office:
    container_name: ${AVENIRS_PORTFOLIO_BACK_OFFICE_CONTAINER_NAME}

    build:
      context: .
      dockerfile: ./Dockerfile-avenirs-portfolio-back-office
      args:
        OVERLAY_DIR: ${AVENIRS_PORTFOLIO_BACK_OFFICE_OVERLAY_BASENAME}
        JAVA_ALPINE_VERSION: ${JAVA_ALPINE_VERSION}
    restart: always
    ports:
      - "${AVENIRS_PORTFOLIO_BACK_OFFICE_CONTAINER_PORT}:10010"
    environment:
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
    depends_on:
      - postgresql-primary
    networks:
      - avenirs-api-network
    
  
  
  avenirs-portfolio-interoperability:
    container_name: ${AVENIRS_PORTFOLIO_INTEROPERABILITY_CONTAINER_NAME}

    build:
      context: .
      dockerfile: ./Dockerfile-avenirs-portfolio-interoperability
      args:
        OVERLAY_DIR: ${AVENIRS_PORTFOLIO_INTEROPERABILITY_OVERLAY_BASENAME}
        JAVA_ALPINE_VERSION: ${JAVA_ALPINE_VERSION}
    restart: always
    ports:
      - "${AVENIRS_PORTFOLIO_INTEROPERABILITY_CONTAINER_PORT}:10020"
    environment:
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
    depends_on:
      - postgresql-primary
    networks:
      - avenirs-api-network
    
  avenirs-portfolio-security:
    container_name: ${AVENIRS_PORTFOLIO_SECURITY_CONTAINER_NAME}
   
    build:
      context: .
      dockerfile: ./Dockerfile-avenirs-portfolio-security
      args:
        AVENIRS_PORTFOLIO_SECURITY_VERSION: ${AVENIRS_PORTFOLIO_SECURITY_VERSION}
        OVERLAY_DIR: ${AVENIRS_PORTFOLIO_SECURITY_OVERLAY_BASENAME}
        JAVA_VERSION: ${JAVA_VERSION}
    restart: no
    ports:
      - "${AVENIRS_PORTFOLIO_SECURITY_CONTAINER_PORT}:12000"
    environment:
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD}
    depends_on:
      - postgresql-primary
    networks:
      - avenirs-api-network

  avenirs-cofolio-client:
    container_name: ${AVENIRS_COFOLIO_CLIENT_CONTAINER_NAME}
   
    build:
      context: ./avenirs-cofolio-client
      dockerfile: ../Dockerfile-avenirs-cofolio-client
      args:
        OVERLAY_DIR: ${AVENIRS_COFOLIO_CLIENT_OVERLAY_BASENAME}
        NODE_ALPINE_VERSION: ${NODE_ALPINE_VERSION}
        NGINX_VERSION: ${NGINX_VERSION}
    restart: always
    ports:
      - "${AVENIRS_COFOLIO_CLIENT_CONTAINER_PORT}:80"
    depends_on:
      - avenirs-portfolio-api
    networks:
      - avenirs-api-network

  avenirs-openapi-merge:
    image: node:${NODE_VERSION}
    container_name: avenirs-openapi-merge
    restart: "no"
    depends_on:
      - avenirs-portfolio-api
      - avenirs-portfolio-back-office
    networks:
      - avenirs-api-network
    volumes:
      - ./scripts:/work/scripts:ro
      - api-specs:/usr/local/apache2/htdocs/api-specs
    entrypoint: ["bash", "-lc", "apt-get update && apt-get install -y jq && API_SPECS_DIR=/usr/local/apache2/htdocs/api-specs bash /work/scripts/merge-openapi-specs.sh"]

networks: 
  avenirs-api-network:
    external: true
    name: ${AVENIRS_NETWORK}

volumes:
  srv-dev_file-storage:
    external: true
  api-specs: {}
  